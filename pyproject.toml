[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-review-sentinel"
version = "2.1.0"
description = "Security Pair Programmer (SPP) - Enterprise-grade AST-based security scanner with auto-fix and contextual learning for Python/JS/TS projects"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jhox", email = "jhoxgamer@gmail.com"}
]
keywords = [
    "security", "ast", "secret-detection", "auto-fix", "devsecops",
    "python", "typescript", "fastapi", "nextjs", "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
dependencies = [
    "pygments>=2.17",
    "pyyaml>=6.0",
    "click>=8.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.urls]
Homepage = "https://github.com/jhoxgamer/hermes-review-sentinel"
Repository = "https://github.com/jhoxgamer/hermes-review-sentinel"
Issues = "https://github.com/jhoxgamer/hermes-review-sentinel/issues"

[project.scripts]
hermes-sentinel = "src.sentinel_server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "W", "PTH"]
ignore = ["E501", "S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]